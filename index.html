<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>用户资料管理</title>
  <style>
    :root {
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --danger: #dc2626;
      --bg: #f1f5f9;
      --card: #ffffff;
      --border: #e2e8f0;
      --text: #1e293b;
      --text-light: #64748b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      padding: 12px;
      max-width: 800px;
      margin: 0 auto;
      padding-bottom: 50px;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      flex-wrap: wrap;
      gap: 10px;
    }
    h1 { font-size: 1.35rem; font-weight: 700; }
    .btn {
      border: none;
      border-radius: 8px;
      padding: 8px 14px;
      font-size: 14px;
      cursor: pointer;
      font-weight: 500;
      transition: 0.15s;
    }
    .btn-primary { background: var(--primary); color: white; }
    .btn-primary:hover { background: var(--primary-dark); }
    .btn-outline { background: white; border: 1px solid var(--border); color: var(--text); }
    .btn-outline:hover { background: #f8fafc; }
    .btn-danger { background: var(--danger); color: white; }
    .btn-sm { padding: 5px 10px; font-size: 13px; }
    .btn-xs { padding: 3px 8px; font-size: 12px; }
    .search-box {
      width: 100%;
      padding: 11px 14px;
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: 15px;
      margin-bottom: 14px;
      outline: none;
      background: white;
    }
    .search-box:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(37,99,235,0.12); }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 12px;
      box-shadow: 0 1px 2px rgba(0,0,0,0.04);
    }
    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 6px;
    }
    .card-title { font-weight: 600; font-size: 17px; }
    .card-actions { display: flex; gap: 6px; flex-shrink: 0; }
    .yesterday-stat {
      color: #dc2626;
      font-size: 14px;
      font-weight: 500;
      margin-bottom: 8px;
    }
    .info-row {
      font-size: 14px;
      margin-bottom: 6px;
      word-break: break-all;
    }
    .info-row .label { color: var(--text-light); margin-right: 6px; }
    .section {
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px dashed var(--border);
    }
    .section-title {
      font-size: 13px;
      color: var(--text-light);
      margin-bottom: 8px;
      font-weight: 500;
    }
    .item-box {
      background: #f8fafc;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 10px;
      margin-bottom: 6px;
      font-size: 13px;
    }
    .item-name { font-weight: 600; color: var(--primary); margin-bottom: 4px; }
    .item-content { word-break: break-all; color: #334155; white-space: pre-wrap; }
    .kami-item {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 8px;
    }
    .kami-item .left { flex: 1; min-width: 0; }
    .empty {
      text-align: center;
      padding: 50px 20px;
      color: var(--text-light);
      font-size: 15px;
    }
    .toolbar { display: flex; gap: 8px; flex-wrap: wrap; }
    .count { font-size: 13px; color: var(--text-light); margin-bottom: 10px; }
    .highlight {
      color: #dc2626;
      background: #fef2f2;
      font-weight: 600;
      padding: 0 2px;
      border-radius: 2px;
    }

    .modal-mask {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.45);
      display: none;
      align-items: flex-end;
      justify-content: center;
      z-index: 100;
    }
    .modal-mask.show { display: flex; }
    .modal {
      background: white;
      width: 100%;
      max-width: 520px;
      border-radius: 16px 16px 0 0;
      padding: 20px 18px 0;
      max-height: 92vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    @media (min-width: 600px) {
      .modal-mask { align-items: center; }
      .modal { border-radius: 16px; }
    }
    .modal h2 { font-size: 1.15rem; margin-bottom: 18px; flex-shrink: 0; }
    .modal-body {
      flex: 1;
      overflow-y: auto;
      padding-bottom: 12px;
      -webkit-overflow-scrolling: touch;
    }
    .form-group { margin-bottom: 14px; }
    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      margin-bottom: 5px;
      color: var(--text-light);
    }
    .input-wrap {
      display: flex;
      gap: 8px;
      align-items: flex-start;
    }
    .input-wrap input,
    .input-wrap textarea {
      flex: 1;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 15px;
      outline: none;
      font-family: inherit;
    }
    .input-wrap input:focus,
    .input-wrap textarea:focus {
      border-color: var(--primary);
    }
    .input-wrap textarea { resize: vertical; min-height: 70px; }
    .clear-btn {
      flex-shrink: 0;
      background: #f1f5f9;
      color: #64748b;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0 12px;
      font-size: 13px;
      height: 42px;
      cursor: pointer;
      white-space: nowrap;
    }
    .clear-btn:hover { background: #e2e8f0; color: #334155; }
    .clear-btn.textarea-clear {
      height: auto;
      padding: 10px 12px;
      align-self: stretch;
    }
    .modal-footer {
      display: flex;
      gap: 10px;
      padding: 14px 0 20px;
      flex-shrink: 0;
      background: white;
      border-top: 1px solid var(--border);
      position: sticky;
      bottom: 0;
      z-index: 10;
    }
    .modal-footer .btn { flex: 1; padding: 12px; min-width: 110px; }

    .list-box {
      background: #f8fafc;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      margin-top: 6px;
    }
    .list-item {
      background: white;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 10px;
      position: relative;
    }
    .list-item .remove-btn {
      position: absolute;
      top: 8px;
      right: 8px;
      background: #fee2e2;
      color: #b91c1c;
      border: none;
      border-radius: 6px;
      padding: 2px 8px;
      font-size: 12px;
      cursor: pointer;
    }
    .add-btn {
      width: 100%;
      margin-top: 4px;
      background: #eff6ff;
      color: var(--primary);
      border: 1px dashed #93c5fd;
    }

    .export-tip {
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      border-radius: 8px;
      padding: 12px;
      font-size: 13px;
      color: #1e40af;
      margin-bottom: 14px;
      line-height: 1.6;
    }
    .export-content {
      background: #f8fafc;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      font-size: 12px;
      max-height: 220px;
      overflow: auto;
      white-space: pre-wrap;
      word-break: break-all;
      margin-bottom: 8px;
      user-select: all;
    }
  </style>
</head>
<body>
  <header>
    <h1>用户资料管理</h1>
    <div class="toolbar">
      <button class="btn btn-outline btn-sm" onclick="exportData()">导出</button>
      <button class="btn btn-outline btn-sm" onclick="document.getElementById('importFile').click()">导入</button>
      <input type="file" id="importFile" accept=".json" style="display:none" onchange="importData(event)" />
      <button class="btn btn-primary btn-sm" onclick="openModal()">+ 添加</button>
    </div>
  </header>

  <input type="text" class="search-box" id="search" placeholder="搜索用户名、卡密、备注、后台链接..." oninput="render()" />
  <div class="count" id="count"></div>
  <div id="list"></div>

  <!-- 添加/编辑弹窗 -->
  <div class="modal-mask" id="modal">
    <div class="modal">
      <h2 id="modalTitle">添加用户</h2>
      <form id="form" onsubmit="saveItem(event)" style="display:flex;flex-direction:column;flex:1;min-height:0;">
        <input type="hidden" id="editId" />
        <div class="modal-body">
          <div class="form-group">
            <label>用户名 *</label>
            <div class="input-wrap">
              <input type="text" id="username" required placeholder="请输入用户名" />
              <button type="button" class="clear-btn" onclick="clearField('username')">清空</button>
            </div>
          </div>

          <div class="form-group">
            <label>昨日统计</label>
            <div class="input-wrap">
              <input type="text" id="yesterdayStat" placeholder="例如：访问 128 / 注册 12" />
              <button type="button" class="clear-btn" onclick="clearField('yesterdayStat')">清空</button>
            </div>
          </div>

          <div class="form-group">
            <label>后台链接</label>
            <div class="list-box" id="backendList"></div>
            <button type="button" class="btn add-btn" onclick="addBackendItem()">+ 添加后台链接</button>
          </div>

          <div class="form-group">
            <label>卡密列表</label>
            <div class="list-box" id="kamiList"></div>
            <button type="button" class="btn add-btn" onclick="addKamiItem()">+ 添加卡密</button>
          </div>

          <div class="form-group">
            <label>自定义备注</label>
            <div class="list-box" id="noteList"></div>
            <button type="button" class="btn add-btn" onclick="addNoteItem()">+ 添加备注</button>
          </div>
        </div>

        <div class="modal-footer">
          <button type="button" class="btn btn-outline" onclick="closeModal()">取消</button>
          <button type="submit" class="btn btn-primary">保存</button>
        </div>
      </form>
    </div>
  </div>

  <!-- 导出弹窗 -->
  <div class="modal-mask" id="exportModal">
    <div class="modal">
      <h2>导出数据</h2>
      <div class="modal-body">
        <div class="export-tip">
          <strong>手机用户请优先用「复制全部内容」</strong><br>
          iPhone Safari 经常禁止网页自动下载文件。<br>
          复制后粘贴到「备忘录」保存即可。
        </div>
        <div class="export-content" id="exportContent"></div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline" onclick="closeExportModal()">关闭</button>
        <button type="button" class="btn btn-outline" onclick="copyExportData()">复制全部内容</button>
        <button type="button" class="btn btn-primary" id="shareBtn" onclick="shareData()" style="display:none">系统分享</button>
        <button type="button" class="btn btn-primary" onclick="downloadFile()">尝试下载文件</button>
      </div>
    </div>
  </div>

  <script>
    const STORAGE_KEY = 'user_manager_data_v6';

    function loadData() {
      try {
        return JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
      } catch {
        return [];
      }
    }

    function saveData(data) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    }

    function generateId() {
      return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
    }

    function cleanContent(text) {
      if (!text) return '';
      return text.split('\n')
        .map(line => line.trimEnd())
        .filter(line => line.trim().length > 0)
        .join('\n');
    }

    function highlight(text, keyword) {
      if (!text) return '';
      const escaped = escapeHtml(text);
      if (!keyword) return escaped;
      const reg = new RegExp('(' + keyword.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi');
      return escaped.replace(reg, '<span class="highlight">$1</span>');
    }

    function formatLink(url) {
      if (!url) return '';
      url = url.trim();
      if (!/^https?:\/\//i.test(url)) {
        url = 'https://' + url;
      }
      return url;
    }

    function clearField(id) {
      const el = document.getElementById(id);
      if (el) {
        el.value = '';
        el.focus();
      }
    }

    // 兼容旧数据：backend 可能是字符串
    function normalizeBackends(item) {
      if (Array.isArray(item.backends)) return item.backends;
      if (item.backend && typeof item.backend === 'string' && item.backend.trim()) {
        return [{ id: generateId(), name: '', content: item.backend.trim() }];
      }
      return [];
    }

    function render() {
      const keyword = document.getElementById('search').value.trim();
      const keywordLower = keyword.toLowerCase();
      let data = loadData();

      if (keywordLower) {
        data = data.filter(item => {
          const cardsText = (item.cards || []).map(c => (c.name || '') + ' ' + (c.content || '')).join(' ');
          const notesText = (item.notes || []).map(n => (n.name || '') + ' ' + (n.content || '')).join(' ');
          const backends = normalizeBackends(item);
          const backendsText = backends.map(b => (b.name || '') + ' ' + (b.content || '')).join(' ');
          const str = [item.username, item.yesterdayStat, cardsText, notesText, backendsText].join(' ').toLowerCase();
          return str.includes(keywordLower);
        });
      }

      data.sort((a, b) => (b.created || 0) - (a.created || 0));

      const list = document.getElementById('list');
      document.getElementById('count').textContent = `共 ${data.length} 条`;

      if (data.length === 0) {
        list.innerHTML = `<div class="empty">${keyword ? '没有找到匹配的记录' : '暂无数据，点击右上角添加'}</div>`;
        return;
      }

      list.innerHTML = data.map(item => {
        const cards = item.cards || [];
        const cardsHtml = cards.length
          ? cards.map(c => `
              <div class="item-box">
                <div class="kami-item">
                  <div class="left">
                    <div class="item-name">${highlight(c.name || '未命名卡密', keyword)}</div>
                    <div class="item-content">${highlight(c.content || '', keyword)}</div>
                  </div>
                  <button class="btn btn-outline btn-xs" onclick="copyText(\`${escapeHtml(c.content || '')}\`)">复制</button>
                </div>
              </div>
            `).join('')
          : '<div style="color:#94a3b8;font-size:13px">暂无卡密</div>';

        const notesHtml = (item.notes && item.notes.length)
          ? item.notes.map(n => `
              <div class="item-box">
                <div class="item-name">${highlight(n.name || '未命名备注', keyword)}</div>
                <div class="item-content">${highlight(n.content || '', keyword)}</div>
              </div>
            `).join('')
          : '<div style="color:#94a3b8;font-size:13px">暂无备注</div>';

        const backends = normalizeBackends(item);
        const backendsHtml = backends.length
          ? backends.map(b => {
              const url = formatLink(b.content || '');
              return `
                <div class="item-box" style="text-align:left !important;">
                  ${b.name ? `<div class="item-name" style="text-align:left !important;">${highlight(b.name, keyword)}</div>` : ''}
                  <div class="item-content" style="text-align:left !important;">
                    ${url
                      ? `<a href="${escapeHtml(url)}" target="_blank" rel="noopener noreferrer" style="color:#2563eb;text-decoration:underline;display:block;text-align:left !important;">${highlight(b.content || '', keyword)}</a>`
                      : highlight(b.content || '', keyword)}
                  </div>
                </div>
              `;
            }).join('')
          : '<div style="color:#94a3b8;font-size:13px">暂无后台链接</div>';

        return `
          <div class="card">
            <div class="card-header">
              <div class="card-title">${highlight(item.username || '未命名', keyword)}</div>
              <div class="card-actions">
                <button class="btn btn-outline btn-sm" onclick="editItem('${item.id}')">编辑</button>
                <button class="btn btn-danger btn-sm" onclick="deleteItem('${item.id}')">删除</button>
              </div>
            </div>
            ${item.yesterdayStat ? `<div class="yesterday-stat">昨日统计：${highlight(item.yesterdayStat, keyword)}</div>` : ''}
            
            <div class="section" style="margin-top:8px;padding-top:8px;border-top:none">
              <div class="section-title">后台链接（${backends.length}）</div>
              ${backendsHtml}
            </div>
            
            <div class="section">
              <div class="section-title">卡密（${cards.length}）</div>
              ${cardsHtml}
            </div>
            <div class="section">
              <div class="section-title">备注（${(item.notes || []).length}）</div>
              ${notesHtml}
            </div>
          </div>
        `;
      }).join('');
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;')
        .replace(/`/g, '&#96;');
    }

    function copyText(text) {
      if (!text) {
        alert('内容为空');
        return;
      }
      text = text.replace(/&#39;/g, "'").replace(/&#96;/g, '`');
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(() => alert('已复制')).catch(() => fallbackCopy(text));
      } else {
        fallbackCopy(text);
      }
    }

    function fallbackCopy(text) {
      const textarea = document.createElement('textarea');
      textarea.value = text;
      textarea.style.position = 'fixed';
      textarea.style.left = '-9999px';
      document.body.appendChild(textarea);
      textarea.select();
      try {
        document.execCommand('copy');
        alert('已复制');
      } catch (e) {
        alert('复制失败，请手动长按选择');
      }
      document.body.removeChild(textarea);
    }

    let tempCards = [];
    let tempNotes = [];
    let tempBackends = [];

    function renderBackendList() {
      const box = document.getElementById('backendList');
      if (tempBackends.length === 0) {
        box.innerHTML = '<div style="color:#94a3b8;font-size:13px;text-align:center;padding:8px 0">暂无后台链接</div>';
        return;
      }
      box.innerHTML = tempBackends.map((b, index) => `
        <div class="list-item">
          <button type="button" class="remove-btn" onclick="removeBackendItem(${index})">删除</button>
          <div class="form-group" style="margin-bottom:8px">
            <label style="font-size:12px">链接名称（可选）</label>
            <div class="input-wrap">
              <input type="text" value="${escapeHtml(b.name || '')}" oninput="updateBackend(${index}, 'name', this.value)" placeholder="例如：主后台、备用后台" />
              <button type="button" class="clear-btn" onclick="clearBackendField(${index}, 'name')">清空</button>
            </div>
          </div>
          <div class="form-group" style="margin-bottom:0">
            <label style="font-size:12px">后台链接</label>
            <div class="input-wrap">
              <input type="text" value="${escapeHtml(b.content || '')}" oninput="updateBackend(${index}, 'content', this.value)" placeholder="https://..." />
              <button type="button" class="clear-btn" onclick="clearBackendField(${index}, 'content')">清空</button>
            </div>
          </div>
        </div>
      `).join('');
    }

    function renderKamiList() {
      const box = document.getElementById('kamiList');
      if (tempCards.length === 0) {
        box.innerHTML = '<div style="color:#94a3b8;font-size:13px;text-align:center;padding:8px 0">暂无卡密</div>';
        return;
      }
      box.innerHTML = tempCards.map((c, index) => `
        <div class="list-item">
          <button type="button" class="remove-btn" onclick="removeKamiItem(${index})">删除</button>
          <div class="form-group" style="margin-bottom:8px">
            <label style="font-size:12px">卡密名称</label>
            <div class="input-wrap">
              <input type="text" value="${escapeHtml(c.name || '')}" oninput="updateKami(${index}, 'name', this.value)" placeholder="例如：月卡、年卡、试用" />
              <button type="button" class="clear-btn" onclick="clearKamiField(${index}, 'name')">清空</button>
            </div>
          </div>
          <div class="form-group" style="margin-bottom:0">
            <label style="font-size:12px">卡密内容（支持多行，自动去空行）</label>
            <div class="input-wrap">
              <textarea rows="3" oninput="updateKami(${index}, 'content', this.value)" placeholder="直接粘贴卡密内容，支持换行">${escapeHtml(c.content || '')}</textarea>
              <button type="button" class="clear-btn textarea-clear" onclick="clearKamiField(${index}, 'content')">清空</button>
            </div>
          </div>
        </div>
      `).join('');
    }

    function renderNoteList() {
      const box = document.getElementById('noteList');
      if (tempNotes.length === 0) {
        box.innerHTML = '<div style="color:#94a3b8;font-size:13px;text-align:center;padding:8px 0">暂无备注</div>';
        return;
      }
      box.innerHTML = tempNotes.map((n, index) => `
        <div class="list-item">
          <button type="button" class="remove-btn" onclick="removeNoteItem(${index})">删除</button>
          <div class="form-group" style="margin-bottom:8px">
            <label style="font-size:12px">备注名称</label>
            <div class="input-wrap">
              <input type="text" value="${escapeHtml(n.name || '')}" oninput="updateNote(${index}, 'name', this.value)" placeholder="例如：联系方式、到期时间" />
              <button type="button" class="clear-btn" onclick="clearNoteField(${index}, 'name')">清空</button>
            </div>
          </div>
          <div class="form-group" style="margin-bottom:0">
            <label style="font-size:12px">备注内容</label>
            <div class="input-wrap">
              <textarea rows="2" oninput="updateNote(${index}, 'content', this.value)" placeholder="备注内容">${escapeHtml(n.content || '')}</textarea>
              <button type="button" class="clear-btn textarea-clear" onclick="clearNoteField(${index}, 'content')">清空</button>
            </div>
          </div>
        </div>
      `).join('');
    }

    function clearBackendField(index, field) {
      if (tempBackends[index]) {
        tempBackends[index][field] = '';
        renderBackendList();
      }
    }

    function clearKamiField(index, field) {
      if (tempCards[index]) {
        tempCards[index][field] = '';
        renderKamiList();
      }
    }

    function clearNoteField(index, field) {
      if (tempNotes[index]) {
        tempNotes[index][field] = '';
        renderNoteList();
      }
    }

    function addBackendItem() {
      tempBackends.push({ id: generateId(), name: '', content: '' });
      renderBackendList();
    }
    function removeBackendItem(index) {
      tempBackends.splice(index, 1);
      renderBackendList();
    }
    function updateBackend(index, field, value) {
      if (tempBackends[index]) tempBackends[index][field] = value;
    }

    function addKamiItem() {
      tempCards.push({ id: generateId(), name: '', content: '' });
      renderKamiList();
    }
    function removeKamiItem(index) {
      tempCards.splice(index, 1);
      renderKamiList();
    }
    function updateKami(index, field, value) {
      if (tempCards[index]) tempCards[index][field] = value;
    }

    function addNoteItem() {
      tempNotes.push({ id: generateId(), name: '', content: '' });
      renderNoteList();
    }
    function removeNoteItem(index) {
      tempNotes.splice(index, 1);
      renderNoteList();
    }
    function updateNote(index, field, value) {
      if (tempNotes[index]) tempNotes[index][field] = value;
    }

    function openModal(id = null) {
      document.getElementById('modal').classList.add('show');
      document.getElementById('form').reset();
      document.getElementById('editId').value = '';
      document.getElementById('modalTitle').textContent = '添加用户';
      tempCards = [];
      tempNotes = [];
      tempBackends = [];

      if (id) {
        const item = loadData().find(i => i.id === id);
        if (item) {
          document.getElementById('editId').value = id;
          document.getElementById('modalTitle').textContent = '编辑用户';
          document.getElementById('username').value = item.username || '';
          document.getElementById('yesterdayStat').value = item.yesterdayStat || '';
          tempCards = JSON.parse(JSON.stringify(item.cards || []));
          tempNotes = JSON.parse(JSON.stringify(item.notes || []));
          tempBackends = JSON.parse(JSON.stringify(normalizeBackends(item)));
        }
      }
      renderBackendList();
      renderKamiList();
      renderNoteList();
    }

    function closeModal() {
      document.getElementById('modal').classList.remove('show');
    }

    function saveItem(e) {
      e.preventDefault();
      const id = document.getElementById('editId').value;

      const cards = tempCards
        .filter(c => c.name.trim() || c.content.trim())
        .map(c => ({
          id: c.id || generateId(),
          name: c.name.trim(),
          content: cleanContent(c.content)
        }));

      const notes = tempNotes
        .filter(n => n.name.trim() || n.content.trim())
        .map(n => ({
          id: n.id || generateId(),
          name: n.name.trim(),
          content: n.content.trim()
        }));

      const backends = tempBackends
        .filter(b => b.name.trim() || b.content.trim())
        .map(b => ({
          id: b.id || generateId(),
          name: b.name.trim(),
          content: b.content.trim()
        }));

      const item = {
        id: id || generateId(),
        username: document.getElementById('username').value.trim(),
        yesterdayStat: document.getElementById('yesterdayStat').value.trim(),
        backends: backends,
        // 兼容旧字段
        backend: backends.length ? backends[0].content : '',
        cards: cards,
        notes: notes,
        created: id ? (loadData().find(i => i.id === id)?.created || Date.now()) : Date.now()
      };

      let data = loadData();
      if (id) {
        data = data.map(i => i.id === id ? item : i);
      } else {
        data.push(item);
      }
      saveData(data);
      closeModal();
      render();
    }

    function editItem(id) {
      openModal(id);
    }

    function deleteItem(id) {
      if (!confirm('确定删除这条记录吗？')) return;
      const data = loadData().filter(i => i.id !== id);
      saveData(data);
      render();
    }

    let exportJsonStr = '';
    let exportFileName = '';

    function exportData() {
      const data = loadData();
      if (data.length === 0) {
        alert('当前没有数据可导出');
        return;
      }
      exportJsonStr = JSON.stringify(data, null, 2);
      exportFileName = `用户资料_${new Date().toISOString().slice(0, 10)}.json`;
      document.getElementById('exportContent').textContent = exportJsonStr;
      if (navigator.share) {
        document.getElementById('shareBtn').style.display = 'inline-block';
      }
      document.getElementById('exportModal').classList.add('show');
    }

    function closeExportModal() {
      document.getElementById('exportModal').classList.remove('show');
    }

    function downloadFile() {
      if (!exportJsonStr) return;
      try {
        const blob = new Blob([exportJsonStr], { type: 'application/json;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = exportFileName;
        a.style.display = 'none';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(() => URL.revokeObjectURL(url), 2000);
        alert('已尝试触发下载。\n如果没有成功，请使用「复制全部内容」。');
      } catch (e) {
        alert('当前环境不支持直接下载，请使用「复制全部内容」。');
      }
    }

    function copyExportData() {
      const text = exportJsonStr;
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(() => alert('✅ 已复制到剪贴板！')).catch(() => fallbackCopy(text));
      } else {
        fallbackCopy(text);
      }
    }

    async function shareData() {
      if (!navigator.share) return;
      try {
        const file = new File([exportJsonStr], exportFileName, { type: 'application/json' });
        await navigator.share({ title: '用户资料备份', files: [file] });
      } catch (e) {
        try {
          await navigator.share({ title: '用户资料备份', text: exportJsonStr });
        } catch (err) {}
      }
    }

    function importData(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function (ev) {
        try {
          const imported = JSON.parse(ev.target.result);
          if (!Array.isArray(imported)) throw new Error('格式错误');
          const cover = confirm(`即将导入 ${imported.length} 条数据。\n\n点击「确定」：覆盖现有全部数据\n点击「取消」：合并到现有数据中`);
          if (cover) {
            saveData(imported);
          } else {
            const existing = loadData();
            const merged = [...existing];
            imported.forEach(item => {
              if (!item.id) item.id = generateId();
              if (!merged.find(i => i.id === item.id)) {
                merged.push(item);
              }
            });
            saveData(merged);
          }
          render();
          alert('导入成功！');
        } catch (err) {
          alert('导入失败：文件格式不正确');
        }
      };
      reader.readAsText(file);
      e.target.value = '';
    }

    document.getElementById('modal').addEventListener('click', function (e) {
      if (e.target === this) closeModal();
    });
    document.getElementById('exportModal').addEventListener('click', function (e) {
      if (e.target === this) closeExportModal();
    });

    render();
  </script>
</body>
</html>
